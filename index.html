<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晝夜同頻｜通販 / 場領資訊查詢</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --ink-night: #171b3a;
    --ink-night2: #262c56;
    --dawn-1: #f6ece0;
    --dawn-2: #f0d9c4;
    --accent-gold: #c9a24b;
    --accent-rose: #b8654f;
    --accent-teal: #3f7d76;
    --line: rgba(23,27,58,0.14);
    --card-bg: rgba(255,255,255,0.72);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Noto Sans TC', sans-serif;
    color: var(--ink-night);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,162,75,0.25), transparent 60%),
      linear-gradient(180deg, var(--ink-night) 0%, var(--ink-night2) 32%, #8a6a86 55%, #d99b78 72%, var(--dawn-2) 88%, var(--dawn-1) 100%);
    background-attachment: fixed;
    padding: 48px 20px 80px;
    position: relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; top:0; left:0; right:0; height:46vh;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, #fff 100%, transparent),
      radial-gradient(1px 1px at 60% 35%, #fff 100%, transparent),
      radial-gradient(1px 1px at 30% 50%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 90% 45%, #fff 100%, transparent),
      radial-gradient(1px 1px at 45% 15%, #fff 100%, transparent),
      radial-gradient(1px 1px at 20% 65%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, #fff 100%, transparent);
    opacity:0.55;
    pointer-events:none;
    z-index:0;
  }

  .wrap{ position:relative; z-index:1; max-width: 760px; margin:0 auto; }

  header{ text-align:center; margin-bottom:36px; }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size: clamp(26px, 5vw, 38px);
    margin:0 0 16px;
    color:#fff;
    text-shadow: 0 2px 18px rgba(0,0,0,0.3);
    letter-spacing:0.03em;
  }
  .sub{
    display:inline-block;
    font-size:15px; font-weight:500;
    color:#fff;
    line-height:1.85;
    max-width:460px;
    margin:0 auto;
    padding: 14px 22px;
    background: rgba(15,17,40,0.32);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:14px;
    backdrop-filter: blur(6px);
  }

  .search-card{
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:20px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(23,27,58,0.35);
  }

  .field-group{
    display:flex; flex-direction:column; gap:6px; margin-bottom:14px;
  }
  .field-group label{
    font-size:12.5px; font-weight:700; color: var(--ink-night2);
    letter-spacing:0.03em;
  }
  input[type="text"]{
    font-family:'Noto Sans TC', sans-serif;
    font-size:16px;
    padding: 14px 16px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background: rgba(255,255,255,0.9);
    color: var(--ink-night);
    outline:none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width:100%;
  }
  input[type="text"]:focus{
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 4px rgba(201,162,75,0.18);
  }
  input[type="text"]:disabled{
    background: rgba(0,0,0,0.04);
    color:#9c99ab;
    cursor:not-allowed;
  }

  .divider{
    display:flex; align-items:center; gap:10px;
    margin: 4px 0 14px;
    color:#9c99ab; font-size:12px;
  }
  .divider::before, .divider::after{
    content:""; flex:1; height:1px; background: var(--line);
  }

  button.search-btn{
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:15px;
    padding: 14px 22px;
    border:none;
    border-radius:12px;
    background: linear-gradient(135deg, var(--ink-night2), var(--ink-night));
    color:#fff;
    cursor:pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    width:100%;
  }
  button.search-btn:hover{ transform: translateY(-1px); box-shadow:0 8px 20px rgba(23,27,58,0.35); }
  button.search-btn:active{ transform: translateY(0); }
  button.search-btn:disabled{ opacity:0.6; cursor:default; transform:none; box-shadow:none; }

  .hint{ margin-top:10px; font-size:12.5px; color:#5c5a72; opacity:0.85; text-align:center; }

  .results{ margin-bottom:26px; display:flex; flex-direction:column; gap:16px; }
  .results:empty{ margin-bottom:0; }

  .result-card{
    background:#fff;
    border-radius:16px;
    padding:0 0 20px;
    border:1px solid var(--line);
    box-shadow: 0 10px 30px rgba(23,27,58,0.10);
    animation: rise 0.35s ease both;
    overflow:hidden;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card-header{
    display:flex; align-items:center; gap:9px;
    padding: 16px 22px;
    font-size:18px; font-weight:700; letter-spacing:0.02em;
    color:#fff;
  }
  .card-header.onsite{ background: linear-gradient(135deg, #c97a63, var(--accent-rose)); }
  .card-header.seven{ background: linear-gradient(135deg, #4c8f87, var(--accent-teal)); }
  .card-header.family{ background: linear-gradient(135deg, #d4ac5c, #a3801f); }
  .card-header.mailship{ background: linear-gradient(135deg, var(--ink-night2), var(--ink-night)); }

  .card-body{ padding: 18px 22px 0; }

  .hero-block{
    background: rgba(23,27,58,0.035);
    border-radius:12px;
    padding: 16px 16px;
    margin-bottom: 14px;
    display:flex; align-items:baseline; flex-wrap:wrap; gap:10px;
  }
  .hero-label{
    font-family:'Noto Sans TC', sans-serif;
    font-size: 22px; font-weight:700;
    color:#8a879c;
    flex-shrink:0;
  }
  .code-hero{
    font-family:'Noto Serif TC', serif;
    font-size: 22px; font-weight:700;
    letter-spacing:0.04em;
    color: var(--ink-night2);
    line-height:1.4;
    word-break: break-word;
  }
  .code-hero.small{ font-size:19px; letter-spacing:0.01em; }

  .row{
    display:flex; justify-content:space-between; gap:16px;
    padding: 9px 0;
    border-bottom: 1px dashed var(--line);
    font-size:14.5px;
  }
  .row:last-child{ border-bottom:none; }
  .row .k{ color:#6b6880; flex-shrink:0; }
  .row .v{ color: var(--ink-night); font-weight:600; text-align:right; }

  .state-card{
    background:#fff;
    border-radius:20px;
    padding: 46px 28px;
    text-align:center;
    border:1px solid var(--line);
    box-shadow: 0 15px 40px rgba(23,27,58,0.18);
    animation: rise 0.35s ease both;
  }
  .state-icon{ font-size:34px; line-height:1; margin-bottom:16px; }
  .state-card strong{
    display:block;
    font-family:'Noto Serif TC', serif;
    font-size:19px; font-weight:700;
    color: var(--ink-night2);
    margin-bottom:8px;
  }
  .state-card p{
    margin:0; color:#6b6880; font-size:14.5px; line-height:1.8;
    max-width:320px; margin-left:auto; margin-right:auto;
  }
  .state-card.error .state-icon{ filter: none; }
  .state-card.error strong{ color: var(--accent-rose); }

  footer{ text-align:center; margin-top:40px; font-size:12.5px; color:#f4e6d6; opacity:0.85; line-height:2; }
  footer a{ color:#fff; text-decoration:underline; text-underline-offset:3px; }
  footer .contact-line{ display:block; }

  @media (max-width:480px){
    .row{ flex-direction:column; gap:2px; }
    .row .v{ text-align:left; }
    .sub{
      max-width: 92vw;
      font-size:14px;
      line-height:1.9;
      padding: 12px 16px;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>《晝夜同頻》領取資訊查詢</h1>
    <p class="sub">輸入預購時填寫的「暱稱」或「Email」其中一項，即可查詢場領編號或通販寄送進度。</p>
  </header>

  <div class="results" id="results">
    <div class="state-card idle">
      <div class="state-icon">🌗</div>
      <strong>尚未查詢</strong>
      <p>在下方輸入暱稱或 Email，按下查詢即可看到領取資訊</p>
    </div>
  </div>

  <div class="search-card">
    <div class="field-group">
      <label for="nicknameInput">暱稱</label>
      <input type="text" id="nicknameInput" placeholder="輸入預購時填寫的暱稱" autocomplete="off">
    </div>

    <div class="divider">擇一填寫即可</div>

    <div class="field-group">
      <label for="emailInput">Email</label>
      <input type="text" id="emailInput" placeholder="輸入預購時填寫的 Email" autocomplete="off">
    </div>

    <button class="search-btn" id="searchBtn">查詢</button>
    <div class="hint">💡 暱稱與 Email 兩者填一個即可，不分大小寫，請輸入完整內容。</div>
  </div>

  <footer>
    <span class="contact-line">《晝夜同頻》｜資料如有疑問請私訊主辦</span>
    <span class="contact-line">Threads：<a href="https://www.threads.com/@first_time0815" target="_blank" rel="noopener">@first_time0815</a></span>
    <span class="contact-line">Mail：<a href="mailto:sine7911@gmail.com">sine7911@gmail.com</a></span>
  </footer>
</div>

<script>
// Google Apps Script 網頁應用程式網址
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzSIodpUK7i5GejtblC66HBMf2uC16QgCas44rrGVu8ni1xjUqX4-h52gecNXqzxMjN/exec';

const nicknameInput = document.getElementById('nicknameInput');
const emailInput = document.getElementById('emailInput');

// 兩個欄位互斥：填了其中一個就鎖住另一個，避免混淆查詢條件
nicknameInput.addEventListener('input', () => {
  emailInput.disabled = nicknameInput.value.trim().length > 0;
});
emailInput.addEventListener('input', () => {
  nicknameInput.disabled = emailInput.value.trim().length > 0;
});

function esc(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function row(k, v){
  if(!v) return '';
  return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;
}

function renderOnsite(item){
  const isProxy = item.method && item.method.includes('代領');
  const methodDisplay = (item.method === '本人領取' || isProxy) ? item.method : ('本人領取（' + item.method + '）');
  let html = `<div class="result-card">
    <div class="card-header onsite">🎪 現場領取</div>
    <div class="card-body">
      <div class="hero-block">
        <span class="hero-label">場領編號</span>
        <div class="code-hero">${esc(item.code || '—')}</div>
      </div>`;
  html += row('暱稱', item.nickname);
  html += row('領取方式', methodDisplay);
  if(isProxy){
    html += row('代領人暱稱', item.proxy || '（未填寫）');
  }
  html += row('購買套組數量', item.qty);
  html += row('備註', item.note);
  html += `</div></div>`;
  return html;
}

function renderMailOrder(item, kind){
  const config = {
    seven:    { label: '7-11 交貨便',     cls: 'seven',    icon: '📮', heroLabel: '取貨門市', heroValue: item.store },
    family:   { label: '全家 店到店',      cls: 'family',   icon: '📦', heroLabel: '取貨門市', heroValue: item.store },
    mailship: { label: '郵寄／國際寄送',   cls: 'mailship', icon: '✉️', heroLabel: '寄送地址', heroValue: item.address }
  };
  const c = config[kind];
  let html = `<div class="result-card">
    <div class="card-header ${c.cls}">${c.icon} ${esc(c.label)}</div>
    <div class="card-body">
      <div class="hero-block">
        <span class="hero-label">${esc(c.heroLabel)}</span>
        <div class="code-hero small">${esc(c.heroValue || '—')}</div>
      </div>`;
  html += row('暱稱', item.nickname);
  html += row('收件真實姓名', item.recipient); // 已在後端遮蔽
  html += row('連絡電話', item.phone);
  html += row('購買套組數量', item.qty);
  html += `</div></div>`;
  return html;
}

async function doSearch(){
  const nickname = nicknameInput.value.trim();
  const email = emailInput.value.trim();
  const raw = nickname || email;

  const resultsEl = document.getElementById('results');
  const btn = document.getElementById('searchBtn');

  if(!raw){
    resultsEl.innerHTML = `<div class="state-card idle">
      <div class="state-icon">🌗</div>
      <strong>尚未查詢</strong>
      <p>請於下方填寫暱稱或 Email 其中一項，按下查詢即可看到領取資訊</p>
    </div>`;
    return;
  }

  btn.disabled = true;
  resultsEl.innerHTML = `<div class="state-card loading">
    <div class="state-icon">⏳</div>
    <strong>查詢中…</strong>
    <p>正在向資料庫確認，請稍候</p>
  </div>`;

  try{
    const url = WEBAPP_URL + '?q=' + encodeURIComponent(raw);
    const res = await fetch(url);
    const data = await res.json();

    if(data.error){
      resultsEl.innerHTML = `<div class="state-card error">
        <div class="state-icon">⚠️</div>
        <strong>查詢失敗</strong>
        <p>${esc(data.error)}</p>
      </div>`;
      return;
    }

    let cards = [];
    (data.onsite || []).forEach(item => cards.push(renderOnsite(item)));
    (data.seven || []).forEach(item => cards.push(renderMailOrder(item, 'seven')));
    (data.family || []).forEach(item => cards.push(renderMailOrder(item, 'family')));
    (data.mail || []).forEach(item => cards.push(renderMailOrder(item, 'mailship')));

    if(cards.length === 0){
      resultsEl.innerHTML = `<div class="state-card empty">
        <div class="state-icon">🔍</div>
        <strong>查無資料</strong>
        <p>請確認暱稱或 Email 是否輸入正確，或聯繫主辦確認</p>
      </div>`;
    } else {
      resultsEl.innerHTML = cards.join('');
    }
  } catch(err){
    resultsEl.innerHTML = `<div class="state-card error">
      <div class="state-icon">⚠️</div>
      <strong>連線失敗</strong>
      <p>請稍後再試，或確認網路連線</p>
    </div>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
[nicknameInput, emailInput].forEach(el => {
  el.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') doSearch();
  });
});
</script>
</body>
</html>
